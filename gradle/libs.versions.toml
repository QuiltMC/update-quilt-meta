[versions]
shadow = "9.6.1"

aws_sdk = "2.57.0"
b2_sdk = "6.5.0"
bouncycastle = "1.86"
guava = "33.7.2-jre"
gson = "2.14.0"
jetbrains_annotations = "26.1.0"
okhttp = "5.5.0"
picocli = "4.7.7"
slf4j = "2.0.20"
tinylog = "2.8.1"

junit = "6.1.3"

[libraries]
aws_bom = { module = "software.amazon.awssdk:bom", version.ref = "aws_sdk" }
aws_s3 = { module = "software.amazon.awssdk:s3" }
b2_core = { module = "com.backblaze.b2:b2-sdk-core", version.ref = "b2_sdk" }
b2_httpclient = { module = "com.backblaze.b2:b2-sdk-httpclient", version.ref = "b2_sdk" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jetbrains_annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains_annotations" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
picocli_annotations = { module = "info.picocli:picocli-codegen", version.ref = "picocli" }
slf4j_api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
tinylog_slf4j = { module = "org.tinylog:slf4j-tinylog", version.ref = "tinylog" }
tinylog_impl = { module = "org.tinylog:tinylog-impl", version.ref = "tinylog" }

junit_api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit_engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit_platform_launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
b2 = ["b2_core", "b2_httpclient"]
junit = ["junit_engine", "junit_platform_launcher"]
tinylog = ["tinylog_slf4j", "tinylog_impl"]

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
